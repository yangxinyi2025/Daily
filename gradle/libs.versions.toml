[versions]
agp = "8.9.2"
kotlin = "2.1.20"
ksp = "2.1.20-1.0.32"
compose-bom = "2025.05.01"
core-ktx = "1.16.0"
lifecycle = "2.8.7"
activity-compose = "1.10.1"
navigation-compose = "2.9.0"
room = "2.7.0"
work = "2.10.0"
